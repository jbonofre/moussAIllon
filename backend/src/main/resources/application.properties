quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.schema-management.strategy=update

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=origin, accept, authorization, content-type, x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,PUT,POST,DELETE
quarkus.tls.trust-all=true

quarkus.http.port=8080
quarkus.http.limits.max-body-size=50M

# JWT configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=moussaillon
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400

# Auth permissions - public endpoints (login, health)
quarkus.http.auth.permission.public.paths=/users/authenticate,/portal/login,/technicien-portal/login,/q/*,/images/*,/documents/*,/flux/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/moussaillon

# AI provider configuration (safe defaults avoid startup failure when keys are absent)
ai.openai.api-key=${AI_OPENAI_API_KEY:1234567890}
ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}
ai.anthropic.model=${AI_ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
ai.anthropic.api-key=${AI_ANTHROPIC_API_KEY:not-set}
ai.anthropic.mcp.enabled=${AI_ANTHROPIC_MCP_ENABLED:true}
ai.anthropic.import-detection.enabled=${AI_ANTHROPIC_IMPORT_DETECTION_ENABLED:true}

# Mailer configuration
quarkus.mailer.from=${MAILER_FROM:noreply@moussaillon.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=${MAILER_MOCK:true}

# Abonnement : prix mensuel par utilisateur du chantier (10 EUR par défaut), par technicien (10 EUR), par client
# ayant accès au portail (0,10 EUR) et par module souscrit
# (par défaut Vente 35, Parc 20, Catalogue 25, Atelier 20, Marketing 20, Comptabilité 20, Paramétrage inclus).
#abonnement.prix-utilisateur=10
#abonnement.prix-technicien=10
#abonnement.prix-client=0.10
#abonnement.prix-module.vente=35
# Paiement en ligne de l'abonnement au montant calculé : comptes Stripe / PayPlug de l'éditeur (distincts des
# comptes payment.* du chantier). Sans clé, les liens de paiement fixes de la société sont utilisés.
#abonnement.stripe.api-key=${ABONNEMENT_STRIPE_API_KEY}
#abonnement.payplug.api-key=${ABONNEMENT_PAYPLUG_API_KEY}
abonnement.paiement.retour-url=${ABONNEMENT_PAIEMENT_RETOUR_URL:http://localhost:3000/chantier/}
# Version « Free » : les accès ne sont jamais bloqués (échéance impayée depuis 2 mois ou plus, abonnement résilié).
abonnement.free=${ABONNEMENT_FREE:false}

# Payment providers
payment.stripe.api-key=${STRIPE_API_KEY:not-set}
payment.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/ventes?payment=success}
payment.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/ventes?payment=cancel}
payment.payplug.api-key=${PAYPLUG_API_KEY:not-set}
payment.payplug.return-url=${PAYPLUG_RETURN_URL:http://localhost:3000/ventes?payment=success}
payment.payplug.cancel-url=${PAYPLUG_CANCEL_URL:http://localhost:3000/ventes?payment=cancel}

# Petites annonces : URL publique de l'application, utilisée dans les flux lus par les plateformes
# (URL du flux et des photos). Doit être joignable depuis Internet.
annonces.public-url=${ANNONCES_PUBLIC_URL:http://localhost:3000}
