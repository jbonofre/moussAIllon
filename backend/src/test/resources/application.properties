# Test configuration - use in-memory H2 database
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import-test.sql
quarkus.hibernate-orm.log.sql=false
# Statistiques : nombre de requêtes SQL d'un appel (RequetesParAppelTest)
quarkus.hibernate-orm.statistics=true
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
# Listes à table de jointure modifiables malgré le filtre du chantier (voir ChantierCollectionPersister)
quarkus.hibernate-orm.unsupported-properties."hibernate.persister.resolver"=net.nanthrax.moussaillon.persistence.ChantierPersisterClassResolver

# Multi-chantier : les données de import-test.sql (sans chantier) sont affectées au chantier test au démarrage,
# qui est aussi celui des requêtes sans jeton (l'authentification est désactivée).
chantier.initial=test
chantier.par-defaut=test

# Administration de l'instance
admin.username=superadmin
admin.password=superadmin123
admin.email=admin@moussaillon.test

# Disable mailer in tests
quarkus.mailer.mock=true

# JWT configuration for tests
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=moussaillon
smallrye.jwt.sign.key.location=privateKey.pem

# Disable auth in tests - override main config
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=
quarkus.http.auth.permission.authenticated.policy=permit

# Disable AI providers in tests
ai.openai.api-key=test-key
ai.openai.model=test-model
ai.anthropic.api-key=test-key
ai.anthropic.model=test-model
ai.anthropic.mcp.enabled=false
ai.anthropic.import-detection.enabled=false

# Payment providers (disabled in tests)
payment.stripe.api-key=test-key
payment.stripe.success-url=http://localhost:8081/success
payment.stripe.cancel-url=http://localhost:8081/cancel
payment.payplug.api-key=test-key
payment.payplug.return-url=http://localhost:8081/success
payment.payplug.cancel-url=http://localhost:8081/cancel

# Petites annonces : URL publique utilisée dans les flux
annonces.public-url=https://chantier.example.com
