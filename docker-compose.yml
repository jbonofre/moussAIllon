services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data
    environment:
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-not-set}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-not-set}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-not-set}
      PAYPLUG_API_KEY: ${PAYPLUG_API_KEY:-not-set}
      MAILER_FROM: ${MAILER_FROM:-noreply@moussaillon.local}
      MAILER_HOST: ${MAILER_HOST:-mailhog}
      MAILER_PORT: ${MAILER_PORT:-1025}
      MAILER_MOCK: ${MAILER_MOCK:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@moussaillon.local}
      CHANTIER_INITIAL: ${CHANTIER_INITIAL:-principal}
      INSCRIPTION_ACTIVE: ${INSCRIPTION_ACTIVE:-true}
      INSCRIPTION_ESSAI_MOIS: ${INSCRIPTION_ESSAI_MOIS:-1}
      CHANTIER_URL: ${CHANTIER_URL:-http://localhost/chantier/}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  chantier-ui:
    build:
      context: chantier-ui
    depends_on:
      backend:
        condition: service_healthy

  client-ui:
    build:
      context: client-ui
    depends_on:
      backend:
        condition: service_healthy

  technicien-ui:
    build:
      context: technicien-ui
    depends_on:
      backend:
        condition: service_healthy

  admin-ui:
    build:
      context: admin-ui
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chantier-ui
      - client-ui
      - technicien-ui
      - admin-ui

volumes:
  backend-data:
